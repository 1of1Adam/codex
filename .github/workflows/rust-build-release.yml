name: rust-build-release

on:
  workflow_dispatch:
  push:
    branches:
      - feat/request-user-input-default-mode

concurrency:
  group: rust-build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: codex-rs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codex-rs -> target"

      - name: Build release
        run: |
          set -euo pipefail
          (
            while true; do
              echo "[keepalive] release build still running at $(date -u +%H:%M:%S)"
              sleep 60
            done
          ) &
          KEEPALIVE_PID=$!
          trap 'kill "$KEEPALIVE_PID" 2>/dev/null || true' EXIT
          cargo build --release -p codex-cli --bin codex --locked
          kill "$KEEPALIVE_PID" 2>/dev/null || true

      - name: Upload codex binary
        uses: actions/upload-artifact@v6
        with:
          name: codex-macos-arm64
          path: codex-rs/target/release/codex
          if-no-files-found: error
          compression-level: 0
